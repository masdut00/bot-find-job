[TELEGRAM]
# Dapatkan bot token dari @BotFather di Telegram
BOT_TOKEN = your_bot_token_here
# Dapatkan chat_id Anda dari @userinfobot di Telegram
CHAT_ID = your_chat_id_here

[SETTINGS]
# Path ke binary bun di sistem / VPS (misal: bun atau /home/production/projects/venv_duta/bin/bun)
BUN_BIN = bun

[SEARCH]
# Fokus lokasi pencarian di Indonesia (atau Remote)
LOCATION = Indonesia

# Daftar kata kunci pencarian pekerjaan sampingan (Non-IT & IT, dipisahkan koma)
# Mencakup: Data Entry, Virtual Assistant, Admin, Data Annotation, Web Scraping, Java & Python Freelance
LINKEDIN_QUERIES = data entry, virtual assistant, admin freelance, data annotator, web scraping, python freelance, java freelance

# Kata kunci di agregator Freehire (remote)
FREEHIRE_QUERIES = web scraping OR scraper, python automation, java developer
